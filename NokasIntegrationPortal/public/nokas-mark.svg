<!--
  NOKAS browser/tab icon.

  Uses only the official wave mark from Nokas_Digital_Logo_stacked.svg — the full
  wordmark is illegible at 16px. White mark on the brand green (#0e4938) reads
  far better in a tab strip than a thin glyph on transparency.

  The mark's bounding box in the source artwork is x 395.59, y 181.10,
  w 288.82, h 144.46; the transform below scales and centres that inside 512².
-->
